name: Publish to PyPI

# Pushing a v* tag (e.g. v0.1.0) builds the package and publishes it to PyPI as
# gimp-mcp-plugin through Trusted Publishing, so no API token is stored in the repo.
# Pull requests that touch packaging only run the build, as a check.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - gimp_mcp_server.py
      - gimp-mcp-plugin.py
      - docs/**
      - .github/workflows/publish.yml

# Read-only by default; the publish job adds only what Trusted Publishing needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No later step needs git auth, so keep the token out of .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: uv build
      - name: Check the wheel runs and includes the docs and plugin
        # Run outside the checkout so the installed wheel is imported, not the repo's files.
        working-directory: ${{ runner.temp }}
        run: |
          wheel=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          uvx --isolated --from "$wheel" python -c "
          import gimp_mcp_server as s
          assert 'site-packages' in s.__file__, s.__file__
          assert s._read_doc('best_practices.md')
          assert s._read_doc('iterative_workflow.md')
          assert s.PLUGIN_SOURCE.is_file(), s.PLUGIN_SOURCE
          print('wheel OK:', s.__file__)
          "
          uvx --isolated --from "$wheel" gimp-mcp-plugin install-plugin --gimp-dir "$RUNNER_TEMP/GIMP/3.2"
          cmp "$RUNNER_TEMP/GIMP/3.2/plug-ins/gimp-mcp-plugin/gimp-mcp-plugin.py" "$GITHUB_WORKSPACE/gimp-mcp-plugin.py"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings > Environments) to approve each release.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
